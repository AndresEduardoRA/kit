# La pila local de Supabase en un job de ci.yml (`pnpm exec supabase start`), con sus puertos reservados antes de levantarla. Viene de
# calesa-app. Los puertos de `supabase/config.toml` (los del bloque del proyecto, y los 543xx que la CLI usa por defecto) caen en el rango
# efímero de Linux (32768–60999): mientras `supabase start` baja sus imágenes en paralelo, una conexión saliente puede tomar uno y el
# contenedor cae con «address already in use». Reservados en `ip_local_reserved_ports`, el kernel no los da como puerto de origen (vale
# también para IPv6). semilla-a-repo reemplaza {{PUERTOS_PILA}} con los de la principal del bloque del proyecto. Aun así la reserva
# puede no alcanzar: si `supabase start` cae con «address already in use», deja quién tenía el puerto y se reintenta una sola vez;
# cualquier otro error cae a la primera.
name: pila
description: Supabase local con sus puertos reservados
inputs:
  sin:
    description: Los servicios que no se levantan (`supabase start -x`)
    required: true
runs:
  using: composite
  steps:
    - name: reservar los puertos de la pila
      shell: bash
      run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54300-54399,{{PUERTOS_PILA}}
    - name: supabase start
      shell: bash
      env:
        SIN: ${{ inputs.sin }}
      run: |
        registro="$RUNNER_TEMP/supabase-start.log"
        if pnpm exec supabase start -x "$SIN" 2>&1 | tee "$registro"; then
          exit 0
        fi
        if ! grep -q "address already in use" "$registro"; then
          exit 1
        fi
        puertos=$(grep "address already in use" "$registro" | grep -oE ':[0-9]{4,5}\b' | tr -d ':' | sort -u | paste -sd '|' - || true)
        echo "::warning::supabase start: un puerto de la pila estaba ocupado (${puertos:-sin puerto en el error}); quién lo tiene:"
        if [ -n "$puertos" ]; then
          sudo ss -tanp | grep -E ":(${puertos})\b" || true
        else
          sudo ss -tanp || true
        fi
        pnpm exec supabase stop --no-backup || true
        pnpm exec supabase start -x "$SIN"
