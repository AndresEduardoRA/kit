# Manifiesto de un proyecto (esquema proyecto/v1). Vive suelto, sin versionar, en proyectos/z_<proyecto>/proyecto.yaml.
# Cada repo lleva una copia en .proyecto/proyecto.yaml (ésa sí versionada) y sólo lee la suya: ninguna sesión abre la
# carpeta de un hermano. Si este archivo se pierde, se rehace con las copias de los repos.
#
# Quién manda en cada campo:
#   - lo del proyecto (repos, nombres, github, puertos, contratos y sus consumidores) → este archivo; si cambia, una
#     tarea «sincronizar manifiesto» en cada repo actualiza su copia;
#   - lo de cada repo (etapa, semilla, versiones que provee) → la copia del repo; `proyecto estado` lo trae aquí.
# Lo escribe semilla-a-repo; lo revisa `python3 validar_semilla.py --manifiesto proyecto.yaml`.

esquema: proyecto/v1
proyecto: cambiar-slug          # la carpeta es z_<proyecto>; cada repo se llama <proyecto>-<rol> en todos lados
nombre: Nombre del proyecto
semilla: semilla/               # relativa a esta carpeta; null si el proyecto nació sin semilla

repos:
  - rol: app                    # minúsculas, 2 a 12 letras: app, web, crm, api…
    nombre: cambiar-slug-app    # siempre <proyecto>-<rol>
    github: CuentaDuena/cambiar-slug-app   # cuenta/repo; un repo ajeno guarda aquí su nombre real
    etapa: construccion         # construccion | mantenimiento
    semilla: null               # en mantenimiento: la etiqueta congelada (semilla-v3) o null si nació sin semilla
    puertos:
      bloque: 6                 # 1-9, nunca 4; único entre todos los z_*/proyecto.yaml de la máquina
      # heredado: {api: 54621, base: 54622, app: 3000}   # para un repo que ya tenía sus puertos: no se mueven
    provee: []                  # [<contrato>@<versión>, …] lo que publica
    consume: []                 # [<contrato>@<versión>, …] la copia fijada que usa

contratos: []
  # - id: agenda-publica
  #   proveedor: app
  #   consumidores: [web]
  #   tipo: base                # base (vistas y RPC) | http (rutas de API) | archivo
  #   vigentes: [1]             # versiones que el proveedor todavía debe cumplir (las que algún consumidor usa)
