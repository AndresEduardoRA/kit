esquema: plan/v1
agentes_disponibles: [claude]
carriles:
  - {id: datos, dueno_de: [supabase/]}
  - {id: agenda, dueno_de: [src/modules/agenda/, src/app/(app)/agenda/]}
  - {id: equipo, dueno_de: [src/modules/equipo/, src/app/(app)/barberos/]}
pasos:
  - id: P01
    titulo: crear las tablas de turnos con su rls
    depende_de: []
    carril: datos
    riesgo: rojo
    modulos: [supabase/migrations/]
    decisiones: [B1, D1, F1]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:probar"}
    terminado: cada fila de la matriz de seguridad tiene su prueba en supabase/tests y pasa
  - id: P02
    titulo: mostrar la agenda del día y de la semana
    depende_de: [P01]
    carril: agenda
    riesgo: verde
    modulos: [src/modules/agenda/, src/app/(app)/agenda/]
    decisiones: [A2]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: {nivel: 1, comando: "pnpm test && pnpm test:e2e e2e/agenda.spec.ts"}
    terminado: el e2e de la agenda pasa en escritorio y celular con sus cinco estados
  - id: P03
    titulo: administrar barberos y horarios
    depende_de: [P01]
    carril: equipo
    riesgo: ambar
    modulos: [src/modules/equipo/, src/app/(app)/barberos/]
    decisiones: [F2]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: {nivel: 1, comando: "pnpm test && pnpm test:e2e e2e/barberos.spec.ts"}
    terminado: el dueño crea un barbero con horario y el barbero no puede editarlo (e2e)
